[package]
name = "gridfinity-studio"
version = "0.1.2"
edition = "2024"
license = "MIT"

[[bin]]
name = "gridfinitystudio"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
manifold-csg = { version = "=0.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
stl_io = "0.8"
anyhow = "1"

[profile.release]
opt-level = 2
